function syncClearBtn() { const inp = $('#q'), b = $('.searchfield .clear'); if (inp && b) b.hidden = !inp.value; }

/* ---------- 비교할 씬 고르기 (라이브러리) ---------- */
function updateLibraryChrome(focusAction) {

}
function startPicking() { store.picking = true; store.picked = []; updateLibraryChrome('pick-cancel'); }
function cancelPicking() { store.picking = false; store.picked = []; updateLibraryChrome('pick-start'); }
function togglePick(name) {
  const has = store.picked.includes(name);

async function copyLink() {
  writeHash(false);
  const url = location.href;
  try {
    await navigator.clipboard.writeText(url);
    setMsg('링크를 복사했어요', 'ok');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = url; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
    setMsg(ok ? '링크를 복사했어요' : '이 환경에서는 클립보드를 쓸 수 없어요. 주소창의 주소를 사용해 주세요', ok ? 'ok' : 'error');
  }
}
const DEMO_LABEL = { slowLoad: '느린 로딩', missingCam: '카메라 이미지 누락', failNext: '다음 작업 실패', searchError: '검색 오류', envUnverified: '실행 환경 미확인', editError: '수정 저장 오류' };

  safeStore.del(UI_KEY);

  MockBackend.setFlags(store.demo);

const ACTIONS = {

  'show-all': (el) => { showAllHidden(el.dataset.scene); setMsg('숨긴 객체를 모두 다시 보이게 했어요', 'quiet'); },

function onClick(e) {
  const t = e.target;
  if (!t.closest('.menu-wrap')) closeMenus();
  const a = t.closest('a[data-nav]');
  if (a) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return; // 새 탭으로 열기는 브라우저 기본 동작
    e.preventDefault();
    if (a.dataset.nav === 'search') navigate({ name: 'search' }); else navigate({ name: 'scene', a: a.dataset.scene });
    return;
  }
  const el = t.closest('[data-action]');
  if (!el || el.disabled || el.matches('input, select')) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el, e);
}
function onInput(e) {
  const el = e.target;
  if (el.dataset.action === 'frame-input') { pause(el.dataset.scene); setFrame(el.dataset.scene, +el.value); }
  else if (el.id === 'q') syncClearBtn();
}
function onChange(e) {
  const el = e.target, a = el.dataset.action;
  if (a === 'speed') setSpeed(el.dataset.scene, +el.value);
  else if (a === 'toggle-sync') toggleSync(el.checked);
  else if (a === 'compare-scene') changeCompareScene(el.dataset.pane, el.value);
  else if (a === 'class-mode') { viewOf(el.dataset.scene).classMode = +el.value; persist(); refreshScene(el.dataset.scene); }
  else if (a === 'filter-cls') { store.filter.cls = el.value; updateSidebar(); }
  else if (a === 'sort-select') { store.sort = { key: el.value }; renderResults(); const s = $('[data-action="sort-select"]'); if (s) s.focus(); }
  else if (a === 'rename-select') {
    const n = el.dataset.scene, it = currentItem(n), sc = $('#ed-scope');
    if (!it) return;
    const scope = it.type === 'gt' && sc && sc.checked ? 'INSTANCE' : 'SAMPLE';
    renameObject(n, it, el.value, scope).then(() => {
      const cur = currentItem(n), s = $('#ed-cls');
      if (cur && s && cur.label !== el.value) s.value = cur.label; // 저장에 실패하면 원래 값으로
    });
  }
}
function onSubmit(e) {
  const f = e.target;
  if (f.matches('[data-form="search"]')) { e.preventDefault(); doSearch(new FormData(f).get('q')); }
  else if (f.matches('[data-form="open-job"]')) { e.preventDefault(); const inp = $('#job-no'); openJobById(inp ? inp.value : ''); if (inp) inp.value = ''; }
}
function trapFocus(e) {
  const box = $('#overlay-root .ql, #overlay-root .alert, #overlay-root .sheet');
  if (!box) return;
  const f = $$('button:not(:disabled), select, input:not(:disabled), [tabindex]:not([tabindex="-1"])', box).filter((x) => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (!box.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
function menuKeys(e, menu) {
  const items = $$('[role^="menuitem"]', menu), k = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[(k + 1) % items.length].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); items[(k - 1 + items.length) % items.length].focus(); }
  else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
  else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
  else if (e.key === 'Escape' || e.key === 'Tab') { const b = $(`#${menu.id}-btn`); closeMenus(); if (e.key === 'Escape') { e.preventDefault(); if (b) b.focus(); } }
  else return false;
  return true;
}
const isTextEntry = (t) => t.matches && t.matches('textarea, select, [contenteditable], input:not([type="checkbox"]):not([type="radio"]):not([type="range"])');
function onKeydown(e) {
  const t = e.target;
  const menu = t.closest && t.closest('.menu');
  if (menu && menuKeys(e, menu)) return;
  if (e.key === 'Escape') {
    if ($('.menu:not([hidden])')) { closeMenus(); return; }
    if (store.overlay) { e.preventDefault(); closeOverlay(false); return; }
    if (store.route.name === 'search' && store.picking) { cancelPicking(); return; }
    const n = activeScene();
    if (n && viewOf(n).selected && !(t.closest && t.closest('input, select'))) selectObj(n, null);
    return;
  }
  if (e.key === 'Tab' && store.overlay) { trapFocus(e); return; }
  if (store.overlay && store.overlay.kind !== 'zoom') return;
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.code === 'KeyZ' && !isTextEntry(t) && store.route.name !== 'search') { e.preventDefault(); undoLast(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (t.matches && t.matches('tr[data-action="select-obj"]') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ACTIONS['select-obj'](t, e); return; }
  if (t.matches && t.matches('[role="tab"]') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    const k = TABS.findIndex(([id]) => id === store.sideTab), nk = (k + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
    store.sideTab = TABS[nk][0]; persist(); updateSidebar();
    const nt = $(`#tab-${store.sideTab}`); if (nt) nt.focus();
    return;
  }
  // 글자를 입력하는 칸에서는 단축키를 쓰지 않습니다. 체크박스·라디오·슬라이더에서는 글자 단축키만 씁니다.
  if (isTextEntry(t)) return;
  if (t.closest && t.closest('.divider, .v3d-canvas')) return;
  if (store.route.name === 'search') return;
  const name = store.overlay ? store.overlay.scene : activeScene();
  if (!name) return;
  const choice = t.matches && t.matches('input[type="checkbox"], input[type="radio"]'), slider = t.matches && t.matches('input[type="range"]');
  const inGroup = t.closest && t.closest('[role="radiogroup"], [role="group"], [role="tablist"]');
  if (e.key === ' ' && !choice && !(t.closest && t.closest('button, a, [role="tab"], tr'))) { e.preventDefault(); togglePlay(name); }
  else if (e.key === 'ArrowLeft' && !inGroup && !choice && !slider) { e.preventDefault(); stepFrame(name, -1); }
  else if (e.key === 'ArrowRight' && !inGroup && !choice && !slider) { e.preventDefault(); stepFrame(name, 1); }
  else if (e.code === 'KeyG') toggleLayer('gt');
  else if (e.code === 'KeyP') toggleLayer('pred');
  else if (e.code === 'KeyH') { const v = viewOf(name); if (v.selected) { toggleHidden(name, v.selected); setMsg(isHidden(name, v.selected) ? '객체를 화면에서 숨겼어요' : '객체를 다시 보이게 했어요', 'quiet'); } }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && !store.overlay && currentItem(name)) { e.preventDefault(); askDelete(name); }
  else if (e.code === 'Backslash' && !store.overlay) toggleSide();
  else if (e.key === '?' && !store.overlay) openOverlay({ kind: 'keys' });
}
function tickElapsed() {
  for (const el of $$('[data-elapsed]')) {
    const from = +el.dataset.from, to = el.dataset.to ? +el.dataset.to : Date.now();
    el.textContent = fmtElapsed(to - from);
  }
}

function boot() {
  loadPersisted();
  applyTheme();
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('submit', onSubmit);
  document.addEventListener('keydown', onKeydown);
  window.addEventListener('hashchange', syncFromLocation);
  window.addEventListener('popstate', syncFromLocation);
  if (FLOW.addEventListener) FLOW.addEventListener('change', () => layoutAll());
  if (DARK_MQ.addEventListener) DARK_MQ.addEventListener('change', () => { if (store.theme === 'auto') applyTheme(); });
  setInterval(tickElapsed, 1000);
  ensureScenes().catch(() => {});
  applyLocation();
}
boot();
