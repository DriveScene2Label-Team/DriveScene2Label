<title>DriveScene2Label</title>
<style>
/* =============================================================================
   DriveScene2Label — Apple × Toss 디자인 (2026-11, 3차)
   기준
   - 회색 바탕 위에 흰 카드(인스펙터, 검색 결과)와 어두운 카드(센서 화면)를 띄웁니다.
   - 영역은 선이 아니라 카드, 여백, 굵은 구분 띠로 나눕니다.
   - 제목은 굵고 크게, 본문은 14px. 숫자는 고정폭 숫자(tabular-nums)로 강조합니다.
   - 색은 회색 단계와 파랑 하나(#3182F6). 데이터 박스만 노랑(GT)·파랑(예측).
   - 버튼은 세 가지: 채운 파랑(주요), 옅은 파랑(보조), 회색(일반). 위험한 동작만 빨강.
   - 누르면 살짝 작아지는 반응(scale .97). 그라데이션, 네온, 파스텔 배지, 이모지 없음.
   - 글꼴은 시스템 글꼴(SF Pro, Apple SD Gothic Neo, Segoe UI, 맑은 고딕). 웹폰트 없음.
   토큰은 :root에 있고, Tailwind theme.extend나 shadcn CSS 변수로 그대로 옮길 수 있습니다.
   ========================================================================== */
:root {
  color-scheme: light;
  /* 바탕과 카드 */
  --bg: #f2f4f6;
  --surface: #ffffff;
  --surface-2: #f9fafb;
  --fill-1: rgba(2, 32, 71, .05);
  --fill-2: rgba(0, 27, 55, .1);
  --fill-3: rgba(0, 29, 58, .18);
  --sep: rgba(0, 27, 55, .08);
  /* 글자 */
  --label: #191f28;
  --label-2: #4e5968;
  --label-3: #8b95a1;
  --label-4: #b0b8c1;
  /* 파랑 하나 */
  --accent: #3182f6;
  --accent-hover: #2272eb;
  --accent-press: #1b64da;
  --accent-text: #1b64da;
  --accent-weak: #e8f3ff;
  --accent-weak-hover: #d6e9ff;
  --focus-ring: rgba(49, 130, 246, .4);
  /* 상태 (글자와 점에만) */
  --red: #f04452;
  --red-text: #d22030;
  --red-weak: #ffeeee;
  --red-weak-hover: #ffe0e0;
  --green: #028450;
  --orange: #c45a00;
  /* 컨트롤 */
  --seg-thumb: #ffffff;
  --menu-bg: #ffffff;
  --toast-bg: rgba(25, 31, 40, .94);
  --shadow-card: 0 1px 2px rgba(0, 27, 55, .04);
  --shadow-lift: 0 12px 32px rgba(0, 27, 55, .1), 0 2px 6px rgba(0, 27, 55, .04);
  --shadow-thumb: 0 1px 2px rgba(0, 27, 55, .06), 0 2px 8px rgba(0, 27, 55, .08);
  --shadow-pop: 0 20px 48px rgba(0, 27, 55, .16), 0 4px 12px rgba(0, 27, 55, .06);
  /* 센서 화면 (테마와 관계없이 어둡게) */
  --media: #101012;
  --media-2: #1b1b1f;
  --media-3: #2a2a30;
  --media-sep: rgba(255, 255, 255, .08);
  --media-label: #f2f4f6;
  --media-label-2: #a7afba;
  --media-label-3: #747b85;
  --media-fill: rgba(255, 255, 255, .1);
  --media-fill-2: rgba(255, 255, 255, .16);
  --media-accent: #4593fc;
  --media-link: #8ec2ff;
  /* 데이터 */
  --gt: #ffc800;
  --gt-ui: #e3a500;
  --pred: #3d8bff;
  /* 형태 */
  --r-xs: 6px;
  --r-sm: 8px;
  --r: 10px;
  --r-md: 14px;
  --r-lg: 16px;
  --r-xl: 20px;
  --r-2xl: 24px;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI Variable Display", "Segoe UI", "Malgun Gothic", "맑은 고딕", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --toolbar-h: 60px;
  --insp-w: 340px;
  --gap: 12px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.36, .64, 1);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #151518;
  --surface: #1f1f24;
  --surface-2: #28282e;
  --fill-1: rgba(255, 255, 255, .06);
  --fill-2: rgba(255, 255, 255, .1);
  --fill-3: rgba(255, 255, 255, .17);
  --sep: rgba(255, 255, 255, .08);
  --label: #eceef1;
  --label-2: #b0b8c1;
  --label-3: #7e8691;
  --label-4: #5b626b;
  --accent: #4593fc;
  --accent-hover: #5ea3ff;
  --accent-press: #3182f6;
  --accent-text: #7db4ff;
  --accent-weak: rgba(69, 147, 252, .16);
  --accent-weak-hover: rgba(69, 147, 252, .24);
  --focus-ring: rgba(69, 147, 252, .55);
  --red: #ff5c69;
  --red-text: #ff7b85;
  --red-weak: rgba(255, 92, 105, .14);
  --red-weak-hover: rgba(255, 92, 105, .22);
  --green: #3ad38a;
  --orange: #ffa53d;
  --seg-thumb: #3a3a42;
  --menu-bg: #26262c;
  --toast-bg: #3a3e46;
  --shadow-card: none;
  --shadow-lift: 0 16px 40px rgba(0, 0, 0, .45);
  --shadow-thumb: 0 1px 3px rgba(0, 0, 0, .35);
  --shadow-pop: 0 24px 56px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .06);
  --gt-ui: #ffc800;
  --media: #08080a;
  --media-2: #17171b;
}

/* ---------- 기본 ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--label);
  font: 400 14px/1.45 var(--font);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  word-break: keep-all; overflow-wrap: break-word;
  font-variant-numeric: tabular-nums;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--label-3); }
.small { font-size: 12.5px; }
.num { text-align: right; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic-fill { fill: currentColor; stroke: none; }
kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: var(--r-xs); background: var(--fill-1); box-shadow: inset 0 -1px 0 var(--fill-2); color: var(--label-2); font: 600 11.5px/1 var(--font); }
.sw { display: inline-block; width: 16px; height: 3px; border-radius: 2px; flex: none; vertical-align: middle; }
.sw-gt { background: repeating-linear-gradient(90deg, var(--gt-ui) 0 4.5px, transparent 4.5px 7px); }
.sw-pred { background: var(--pred); }
*::-webkit-scrollbar { width: 12px; height: 12px; }
*::-webkit-scrollbar-thumb { border: 4px solid transparent; border-radius: 999px; background: var(--fill-3); background-clip: content-box; }
*::-webkit-scrollbar-track { background: transparent; }

/* ---------- 버튼 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 38px; padding: 0 16px; border: 0; border-radius: var(--r);
  background: var(--fill-1); color: var(--label);
  font-size: 14px; font-weight: 600; white-space: nowrap;
  transition: background-color .15s var(--ease), transform .12s var(--ease), opacity .15s var(--ease);
}
.btn:hover:not(:disabled) { background: var(--fill-2); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .4; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn.primary:active:not(:disabled) { background: var(--accent-press); }
.btn.primary:disabled { opacity: .32; }
.btn.weak { background: var(--accent-weak); color: var(--accent-text); }
.btn.weak:hover:not(:disabled) { background: var(--accent-weak-hover); }
.btn.destructive { background: var(--red-weak); color: var(--red-text); }
.btn.destructive:hover:not(:disabled) { background: var(--red-weak-hover); }
.btn.danger { background: var(--red); color: #fff; }
.btn.danger:hover:not(:disabled) { filter: brightness(.94); }
.btn.plain { background: transparent; color: var(--label-2); }
.btn.plain:hover:not(:disabled) { background: var(--fill-1); color: var(--label); }
.btn.sm { height: 32px; padding: 0 12px; border-radius: var(--r-sm); font-size: 13px; }
.btn.wide { width: 100%; height: 50px; border-radius: var(--r-md); font-size: 16px; font-weight: 700; }
.icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--label-2); transition: background-color .15s var(--ease), color .15s var(--ease), transform .12s var(--ease); }
.icon-btn:hover:not(:disabled) { background: var(--fill-1); color: var(--label); }
.icon-btn:active:not(:disabled) { background: var(--fill-2); transform: scale(.94); }
.icon-btn[aria-pressed="true"] { color: var(--accent); }
.icon-btn .ic { width: 20px; height: 20px; }
.link { padding: 0; border: 0; background: none; color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
.link:hover { text-decoration: underline; }

/* ---------- 세그먼트 ---------- */
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--fill-1); min-width: 0; }
.seg > button {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent;
  color: var(--label-2); font-size: 14px; font-weight: 600; white-space: nowrap; min-width: 0;
  transition: background-color .2s var(--ease), box-shadow .2s var(--ease), color .2s var(--ease);
}
.seg > button:hover:not(:disabled) { color: var(--label); }
.seg > button[aria-pressed="true"], .seg > button[aria-selected="true"], .seg > button[aria-checked="true"] { background: var(--seg-thumb); box-shadow: var(--shadow-thumb); color: var(--label); }
.seg > button:disabled { opacity: .4; }
.seg > button .cnt { color: var(--label-3); font-weight: 600; }
.seg > button[aria-pressed="true"] .cnt, .seg > button[aria-selected="true"] .cnt { color: var(--accent-text); }
.seg--full { display: flex; width: 100%; }
.seg--full > button { flex: 1 1 0; }
.seg--sm { padding: 2px; border-radius: 10px; }
.seg--sm > button { height: 28px; padding: 0 11px; border-radius: 8px; font-size: 13px; }
.seg--media { background: rgba(255, 255, 255, .1); }
.seg--media > button { color: var(--media-label-2); }
.seg--media > button:hover:not(:disabled) { color: var(--media-label); }
.seg--media > button[aria-pressed="true"] { background: rgba(255, 255, 255, .22); box-shadow: none; color: #fff; }

/* ---------- 팝업, 스위치, 입력 ---------- */
.popup {
  height: 38px; max-width: 100%; padding: 0 36px 0 14px; border: 0; border-radius: var(--r);
  background: var(--fill-1) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1.5 1.75 6 6.25l4.5-4.5' fill='none' stroke='%238b95a1' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 13px center / 11px 8px;
  color: var(--label); font-size: 14px; font-weight: 500;
  -webkit-appearance: none; appearance: none; cursor: pointer;
  transition: background-color .15s var(--ease);
}
.popup:hover:not(:disabled) { background-color: var(--fill-2); }
.popup:disabled { opacity: .5; cursor: default; }
.popup--sm { height: 32px; padding: 0 30px 0 12px; border-radius: var(--r-sm); background-position: right 11px center; background-size: 10px 7px; font-size: 13px; }
.popup--media { background-color: rgba(255, 255, 255, .1); color: var(--media-label); }
.popup--media:hover:not(:disabled) { background-color: rgba(255, 255, 255, .16); }
.popup--media option { color: #191f28; }
.switch {
  -webkit-appearance: none; appearance: none; position: relative; flex: none;
  width: 44px; height: 26px; margin: 0; border-radius: 13px; background: var(--fill-3); cursor: pointer;
  transition: background-color .25s var(--ease);
}
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .18), 0 0 0 .5px rgba(0, 0, 0, .04); transition: transform .3s var(--spring); }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(18px); }
.switch--media { background: rgba(255, 255, 255, .2); }
.switch--media:checked { background: var(--media-accent); }
.field { height: 38px; padding: 0 12px; border: 0; border-radius: var(--r); background: var(--fill-1); color: var(--label); font-size: 14px; min-width: 0; transition: box-shadow .15s var(--ease), background-color .15s var(--ease); }
.field::placeholder { color: var(--label-4); }
.field:focus { outline: none; background: var(--surface); box-shadow: inset 0 0 0 2px var(--accent); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.st-pending { color: var(--label-3); }
.st-running { color: var(--accent-text); }
.st-completed { color: var(--green); }
.st-failed { color: var(--red-text); }
.st-warn { color: var(--orange); }
.st-running i, .st-pending i { animation: pulse 1.3s ease-in-out infinite; }
.run-dot { display: inline-block; width: 7px; height: 7px; margin-left: 2px; border-radius: 50%; background: var(--accent); vertical-align: 1px; animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.progress { position: relative; height: 6px; margin: 16px 0 12px; border-radius: 3px; background: var(--fill-2); overflow: hidden; }
.progress::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -40%; border-radius: 3px; background: var(--accent); animation: slide 1.4s var(--ease) infinite; }
@keyframes slide { to { left: 100%; } }
.notice { display: flex; gap: 10px; padding: 14px 16px; border-radius: var(--r-md); background: var(--fill-1); color: var(--label-2); font-size: 13.5px; line-height: 1.55; }
.notice .ic { color: var(--orange); margin-top: 1px; }

/* ---------- 앱 골격 ---------- */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-width: 0; background: var(--bg); }
.toolbar {
  position: relative; z-index: 30; flex: none;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px;
  height: var(--toolbar-h); padding: 0 16px 0 12px; background: var(--bg);
}
.tb-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tb-right { display: flex; align-items: center; justify-content: flex-end; gap: 4px; min-width: 0; }
.tb-title { min-width: 0; padding-left: 2px; }
.tb-title h1 { font: 700 18px/1.25 var(--font-display); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-title h1:focus { outline: none; }
.tb-sub { margin-top: 1px; color: var(--label-3); font-size: 12.5px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-modes { background: var(--fill-2); }
.app-mark { display: inline-flex; align-items: center; gap: 10px; padding: 0 6px; color: var(--label); font-size: 17px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
.app-mark .mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: #fff; }
.app-mark .mark .ic { width: 18px; height: 18px; stroke-width: 2; }
.tb-note { color: var(--label-2); font-size: 13.5px; white-space: nowrap; margin-right: 4px; }
.menu-wrap { position: relative; }

.body { flex: 1 1 auto; display: grid; grid-template-columns: minmax(0, 1fr) var(--insp-w); gap: var(--gap); padding: 0 var(--gap) var(--gap); min-height: 0; min-width: 0; }
.app.insp-hidden .body { grid-template-columns: minmax(0, 1fr); }

/* ---------- 센서 화면 카드 ---------- */
.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-radius: var(--r-xl); background: var(--media); color: var(--media-label); overflow: clip; }
:root[data-theme="dark"] .stage { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); }
.hud { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; min-height: 56px; padding: 12px 14px 10px; flex: none; }
.hud-group { display: inline-flex; gap: 6px; }
.hud-tog {
  display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 11px; border: 0; border-radius: 999px;
  background: var(--media-fill); color: var(--media-label); font-size: 13.5px; font-weight: 600; white-space: nowrap;
  transition: background-color .15s var(--ease), color .15s var(--ease), transform .12s var(--ease), box-shadow .15s var(--ease);
}
.hud-tog:hover { background: var(--media-fill-2); }
.hud-tog:active { transform: scale(.96); }
.hud-tog[aria-pressed="false"] { background: transparent; color: var(--media-label-3); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); }
.hud-tog[aria-pressed="false"] .sw { opacity: .3; }
.hud-tog .ic { width: 17px; height: 17px; }
.hud-tog .i-off { display: none; }
.hud-tog[aria-pressed="false"] .i-on { display: none; }
.hud-tog[aria-pressed="false"] .i-off { display: block; }
.hud-tog kbd { background: rgba(255, 255, 255, .1); box-shadow: none; color: var(--media-label-2); min-width: 18px; height: 18px; padding: 0 4px; font-size: 10.5px; }
.hud-note { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 6px 0 14px; border-radius: 999px; background: var(--media-fill); color: var(--media-label-2); font-size: 13px; }
.hud-note:empty { display: none; }
.hud-link { height: 26px; padding: 0 10px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, .12); color: var(--media-link); font-size: 12.5px; font-weight: 700; }
.hud-link:hover { background: rgba(255, 255, 255, .18); }
.hud-gap { flex: 1 1 auto; }
.hud-switch { display: inline-flex; align-items: center; gap: 10px; color: var(--media-label); font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.hud-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--media-fill); color: var(--media-label); font-size: 13.5px; font-weight: 600; white-space: nowrap; transition: background-color .15s var(--ease), transform .12s var(--ease); }
.hud-btn:hover { background: var(--media-fill-2); }
.hud-btn:active { transform: scale(.96); }
.hud-btn.icon { width: 34px; padding: 0; justify-content: center; background: transparent; color: var(--media-label-2); }
.hud-btn.icon:hover { background: var(--media-fill); color: var(--media-label); }
.viewport { position: relative; flex: 1 1 auto; min-height: 0; min-width: 0; }

/* 분할 */
.split { display: flex; height: 100%; min-width: 0; min-height: 0; }
.split[data-orient="stack"] { flex-direction: column; }
.split-a { position: relative; flex: 0 0 calc((100% - 9px) * var(--ratio, .5)); min-width: 0; min-height: 0; }
.split-b { position: relative; flex: 1 1 0; min-width: 0; min-height: 0; }
.divider { position: relative; flex: 0 0 9px; display: flex; align-items: center; justify-content: center; cursor: col-resize; touch-action: none; }
.split[data-orient="stack"] > .divider { cursor: row-resize; }
.divider::after { content: ""; width: 4px; height: 36px; border-radius: 2px; background: rgba(255, 255, 255, .18); transition: background-color .15s, height .2s var(--ease), width .2s var(--ease); }
.split[data-orient="stack"] > .divider::after { width: 36px; height: 4px; }
.divider:hover::after, .divider.is-dragging::after, .divider:focus-visible::after { background: var(--media-accent); }
.split:not([data-orient="stack"]) > .divider:hover::after { height: 52px; }
.split[data-orient="stack"] > .divider:hover::after { width: 52px; }
.divider:focus-visible { outline: none; }
.split--compare > .divider::before { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: var(--media-sep); }

/* 카메라 */
.camgrid { display: grid; gap: 8px; height: 100%; padding: 0 12px 12px; justify-content: center; align-content: center; }
.camgrid[data-layout="3x2"] { grid-template-areas: "fl f fr" "bl b br"; }
.camgrid[data-layout="2x3"] { grid-template-areas: "fl bl" "f b" "fr br"; }
.cam { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; background: #000; overflow: hidden; min-width: 0; container-type: inline-size; }
@container (max-width: 220px) { .cam-label .ch { display: none; } }
@container (max-width: 150px) {
  .cam-label { left: 5px; top: 5px; height: 18px; gap: 3px; padding: 0 7px 0 4px; font-size: 10px; }
  .cam-label svg { width: 11px; height: 11px; }
  .cam-zoom { right: 5px; top: 5px; width: 22px; height: 22px; }
}
.cam::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); pointer-events: none; transition: box-shadow .2s var(--ease); }
.cam.is-current::after { box-shadow: inset 0 0 0 2.5px var(--media-accent); }
.cam-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cam-label { position: absolute; left: 8px; top: 8px; display: flex; align-items: center; gap: 6px; max-width: calc(100% - 48px); height: 22px; padding: 0 10px 0 6px; border-radius: 999px; background: rgba(0, 0, 0, .52); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: #fff; font-size: 11.5px; font-weight: 700; pointer-events: none; white-space: nowrap; overflow: hidden; }
.cam-label .ch { color: rgba(255, 255, 255, .6); font: 500 10px var(--mono); overflow: hidden; text-overflow: ellipsis; }
.glyph { width: 15px; height: 15px; flex: none; }
.glyph-fov { fill: rgba(255, 255, 255, .5); }
.glyph-car { fill: #000; stroke: #fff; stroke-width: 1.2; }
.cam-zoom { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: rgba(0, 0, 0, .52); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: #fff; opacity: 0; transition: opacity .15s var(--ease), transform .12s var(--ease); }
.cam-zoom .ic { width: 14px; height: 14px; }
.cam-zoom:active { transform: scale(.92); }
.cam:hover .cam-zoom, .cam-zoom:focus-visible { opacity: 1; }
@media (hover: none) { .cam-zoom { opacity: 1; } }
.cam-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 12px; text-align: center; background: var(--media-2); color: var(--media-label-2); font-size: 12px; }
.cam-state[hidden] { display: none; }
.cam-state b { color: var(--media-label); font-weight: 700; font-size: 12.5px; }
.cam-state .ic { width: 24px; height: 24px; color: var(--media-label-3); margin-bottom: 2px; }
.cam-state--loading { background: linear-gradient(100deg, var(--media-2) 30%, var(--media-3) 50%, var(--media-2) 70%); background-size: 220% 100%; animation: shimmer 1.5s linear infinite; }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }

/* 3D */
.v3d { position: absolute; inset: 0 12px 12px; border-radius: var(--r-md); overflow: hidden; background: #0b0b0d; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .05); }
.split[data-orient="side"] .split-b > .v3d { left: 0; top: 0; }
.split[data-orient="stack"] .split-b > .v3d { top: 0; }
.v3d-body { position: absolute; inset: 0; }
.v3d-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.v3d-canvas.is-dragging { cursor: grabbing; }
.v3d-canvas:focus-visible { outline-offset: -3px; border-radius: var(--r-md); }
.v3d-head { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.v3d-head > * { pointer-events: auto; }
.v3d-title { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 13px; border-radius: 999px; background: rgba(0, 0, 0, .5); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); font-size: 12.5px; font-weight: 700; white-space: nowrap; min-width: 0; overflow: hidden; }
.v3d-sub { color: var(--media-label-2); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.v3d-gap { flex: 1 1 auto; }
.v3d-head .seg { -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); background: rgba(0, 0, 0, .45); }
.v3d-axes { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 12px; color: var(--media-label-2); font-size: 11.5px; pointer-events: none; }
.v3d-axes b { font: 700 11px var(--mono); margin-right: 3px; }
.ax-x { color: #ff6b63; } .ax-y { color: #5fd17a; } .ax-z { color: #5aa7ff; }
.v3d-note { position: absolute; right: 14px; bottom: 12px; color: var(--media-label-3); font-size: 11.5px; pointer-events: none; }
.pane .v3d-note { display: none; }
.v3d-state { position: absolute; inset: 0; display: grid; place-items: center; color: var(--media-label-2); background: #0b0b0d; font-size: 13px; }
.v3d-state[hidden] { display: none; }

/* 두 씬 비교 */
.split--compare .split-a, .split--compare .split-b { display: flex; }
.pane { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; min-height: 0; }
.pane-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; min-height: 44px; padding: 2px 12px 10px; }
.pane-tag { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--media-fill-2); color: var(--media-label); font-weight: 800; font-size: 13px; flex: none; transition: background-color .2s var(--ease); }
.pane.is-active .pane-tag { background: var(--media-accent); color: #fff; }
.pane-gap { flex: 1 1 auto; }
.pane-target { display: none; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; background: rgba(69, 147, 252, .18); color: var(--media-link); font-size: 12.5px; font-weight: 700; }
.pane-target::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pane.is-active .pane-target { display: inline-flex; }
.pane.is-active .pane-pick { display: none; }
.pane-pick { height: 28px; padding: 0 12px; font-size: 12.5px; }
.pane-body { position: relative; flex: 1 1 auto; min-height: 0; }
.pane-body .v3d { inset: 0 12px 12px; }
.pane-stack { display: flex; flex-direction: column; height: 100%; }
.pane-cams { flex: none; }
.pane-cams .camgrid { height: auto; padding-bottom: 8px; align-content: start; }
.pane-3d { position: relative; flex: 1 1 auto; min-height: 140px; }

/* 재생 막대 (센서 카드 아래에 떠 있는 컨트롤) */
.tl { display: flex; align-items: center; gap: 14px; height: 58px; margin: 0 12px 12px; padding: 0 16px 0 10px; border-radius: var(--r-lg); background: var(--media-2); color: var(--media-label); flex: none; min-width: 0; container-type: inline-size; }
.tl-btns { display: flex; align-items: center; gap: 2px; flex: none; }
.tl-btn { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--media-label); transition: background-color .15s var(--ease), transform .12s var(--ease); }
.tl-btn:hover:not(:disabled) { background: var(--media-fill); }
.tl-btn:active:not(:disabled) { transform: scale(.92); }
.tl-btn:disabled { opacity: .35; }
.tl-btn .ic { width: 16px; height: 16px; }
.tl-play { width: 40px; height: 40px; background: #fff; color: #191f28; margin: 0 3px; }
.tl-play:hover:not(:disabled) { background: #fff; filter: brightness(.94); }
.tl-play .ic { width: 15px; height: 15px; }
.tl-track { position: relative; flex: 1 1 auto; min-width: 90px; height: 34px; display: flex; align-items: center; }
.tl-strip { position: absolute; left: 8px; top: 2px; width: calc(100% - 16px); height: 4px; pointer-events: none; }
.tl-range { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin: 0; background: transparent; cursor: pointer; --pct: 0%; }
.tl-range:disabled { cursor: default; opacity: .4; }
.tl-range::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, #fff 0 var(--pct), rgba(255, 255, 255, .16) var(--pct) 100%); }
.tl-range::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .45); transition: transform .2s var(--spring); }
.tl-range:active::-webkit-slider-thumb { transform: scale(1.2); }
.tl-range::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .16); }
.tl-range::-moz-range-progress { height: 6px; border-radius: 3px; background: #fff; }
.tl-range::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .45); }
.tl-range:focus-visible { outline: none; }
.tl-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(69, 147, 252, .6); }
.tl-read { display: flex; align-items: baseline; justify-content: flex-end; gap: 10px; min-width: 108px; flex: none; }
.tl-frame { white-space: nowrap; font-size: 14px; }
.tl-cur { font-size: 16px; font-weight: 700; }
.tl-tot { color: var(--media-label-2); }
.tl-ts { color: var(--media-label-2); font-size: 12.5px; white-space: nowrap; }
.tl-speed { flex: none; }
/* 비교 화면처럼 폭이 좁은 재생 막대 */
@container (max-width: 520px) {
  .tl-ts { display: none; }
  .tl-read { min-width: 0; }
  .tl-track { min-width: 60px; }
}
@container (max-width: 400px) {
  .tl { gap: 10px; }
  .tl-btns { gap: 0; }
  .tl-track { min-width: 48px; }
}

/* ---------- 인스펙터 카드 ---------- */
.inspector { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-radius: var(--r-xl); background: var(--surface); box-shadow: var(--shadow-card); overflow: clip; container: insp / inline-size; }
.inspector[hidden] { display: none; }
@container insp (max-width: 330px) {
  .list-tools { gap: 6px; }
  .list-tools .seg--sm > button { padding: 0 9px; }
}
@container insp (max-width: 310px) {
  .list-tools { padding-left: 12px; padding-right: 12px; }
  .list-tools .seg--sm > button { padding: 0 7px; }
}
#side-target:empty { display: none; }
.insp-target { display: flex; flex-direction: column; gap: 8px; padding: 16px 14px 0; }
.insp-target .lbl { color: var(--label-3); font-size: 12.5px; font-weight: 600; }
.insp-target .seg > button { justify-content: flex-start; gap: 8px; padding: 0 10px; }
.insp-target .seg > button b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--fill-2); font-size: 11.5px; font-weight: 800; }
.insp-target .seg > button[aria-checked="true"] b { background: var(--accent); color: #fff; }
.insp-tabs { margin: 14px 14px 6px; flex: none; width: auto; }
.insp-panel { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.group { padding: 22px 20px; border-top: 8px solid var(--fill-1); }
.group:first-child { border-top: 0; }
.group-title { margin-bottom: 16px; font-size: 17px; font-weight: 700; letter-spacing: -.015em; }
.form { display: flex; flex-direction: column; gap: 10px; }
.form-row { display: flex; align-items: center; gap: 12px; min-height: 38px; }
.form-row > .row-label { width: 76px; flex: none; color: var(--label-3); font-size: 14px; font-weight: 500; }
.form-row > .row-value { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; }
.form-row > .row-value .muted { font-weight: 500; }
.form-row > .popup { flex: 1 1 auto; }
.row-help { margin: -4px 0 2px 88px; color: var(--label-3); font-size: 12.5px; line-height: 1.5; }
.group .notice { margin: 16px 0 0; }
.group .btn.wide { margin-top: 18px; }
.disclosure { margin-top: 14px; }
.disclosure summary { display: inline-flex; align-items: center; gap: 4px; color: var(--label-3); font-size: 13px; font-weight: 500; cursor: pointer; list-style: none; }
.disclosure summary::-webkit-details-marker { display: none; }
.disclosure summary::before { content: ""; width: 6px; height: 6px; margin: 0 5px 0 2px; border-right: 1.8px solid currentColor; border-bottom: 1.8px solid currentColor; transform: rotate(-45deg); transition: transform .2s var(--ease); }
.disclosure[open] summary::before { transform: rotate(45deg); }
.disclosure summary:hover { color: var(--label-2); }
.disclosure pre { margin: 10px 0 0; padding: 12px 14px; border-radius: var(--r); background: var(--fill-1); font: 11.5px/1.6 var(--mono); color: var(--label-2); white-space: pre-wrap; word-break: break-all; }
.panel-msg { padding: 28px 20px; color: var(--label-3); font-size: 14px; line-height: 1.6; }

/* 객체 편집 */
.editor { padding: 18px 20px 22px; flex: none; }
.editor--empty { display: flex; align-items: center; gap: 14px; padding: 18px 20px; }
.editor--empty p { color: var(--label-2); font-size: 14px; line-height: 1.55; }
.empty-ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--r-md); background: var(--fill-1); color: var(--label-3); flex: none; }
.empty-ic .ic { width: 22px; height: 22px; }
.ed-top { display: flex; align-items: center; gap: 8px; min-height: 30px; }
.ed-kicker { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px 0 10px; border-radius: 999px; background: var(--fill-1); color: var(--label-2); font-size: 13px; font-weight: 600; }
.ed-top .icon-btn { margin-left: auto; width: 32px; height: 32px; background: var(--fill-1); }
.ed-top .icon-btn:hover { background: var(--fill-2); }
.ed-top .icon-btn .ic { width: 15px; height: 15px; }
.ed-label { margin-top: 14px; font: 700 28px/1.2 var(--font-display); letter-spacing: -.025em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-meta { margin-top: 6px; color: var(--label-2); font-size: 14.5px; }
.ed-orig { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--accent-text); font-size: 13.5px; font-weight: 600; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.ed-form { margin-top: 18px; border-radius: var(--r-lg); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--sep); }
.ed-row { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px 10px 16px; }
.ed-row + .ed-row { border-top: 1px solid var(--sep); }
.ed-row-l { flex: 1 1 auto; min-width: 0; font-size: 15px; font-weight: 600; cursor: pointer; }
.ed-row-s { display: block; margin-top: 2px; color: var(--label-3); font-size: 12.5px; font-weight: 400; }
.ed-row .popup { flex: 0 1 auto; min-width: 150px; background-color: var(--surface); box-shadow: inset 0 0 0 1px var(--sep); }
:root[data-theme="dark"] .ed-row .popup { background-color: var(--fill-2); box-shadow: none; }
.ed-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.ed-actions .btn { height: 46px; border-radius: var(--r-md); font-size: 15px; }
.ed-more dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 10px; margin: 10px 0 0; font-size: 12.5px; }
.ed-more dt { color: var(--label-3); }
.ed-more dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font: 12px var(--mono); color: var(--label-2); }
.list-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 18px 16px 8px; border-top: 8px solid var(--fill-1); flex: none; }
.list-tools .seg { flex: none; }
.list-tools .popup { flex: 1 1 0; min-width: 104px; }
.obj-scroll { flex: 1 1 auto; min-height: 140px; overflow-y: auto; padding: 0 8px 12px; }
.otable { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.otable thead th { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.otable td { height: 60px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background-color .12s var(--ease); }
.otable tbody tr { cursor: pointer; }
.otable tbody tr td:first-child { border-radius: var(--r-md) 0 0 var(--r-md); padding: 0 4px 0 8px; }
.otable tbody tr td:last-child { border-radius: 0 var(--r-md) var(--r-md) 0; padding: 0 6px 0 0; }
.otable tbody tr:hover td { background: var(--fill-1); }
.otable tbody tr.is-sel td { background: var(--accent-weak); }
.otable tbody tr.is-sel .c-cls { color: var(--accent-text); }
.otable tbody tr.is-sel .o-ic { background: var(--surface); }
.otable tbody tr:focus-visible { outline: none; }
.otable tbody tr:focus-visible td { box-shadow: inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent); }
.otable tbody tr:focus-visible td:first-child { box-shadow: inset 2px 2px 0 var(--accent), inset 0 -2px 0 var(--accent); }
.otable tbody tr:focus-visible td:last-child { box-shadow: inset -2px 2px 0 var(--accent), inset 0 -2px 0 var(--accent); }
.otable tbody tr.is-hidden .c-main, .otable tbody tr.is-hidden .num, .otable tbody tr.is-hidden .o-ic { opacity: .4; }
.o-ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--fill-1); transition: background-color .12s var(--ease); }
.o-ic .sw { width: 18px; }
.c-main { line-height: 1.3; }
.otable .c-cls { display: block; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.otable .c-cls .dot { margin-left: 6px; vertical-align: 2px; }
.otable .c-sub { display: block; margin-top: 2px; color: var(--label-3); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
.otable .num { color: var(--label-2); font-size: 14px; font-weight: 600; }
.eye { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--label-3); opacity: .5; transition: opacity .12s, background-color .12s; }
.otable tbody tr:hover .eye, .eye:focus-visible, .eye[aria-pressed="false"] { opacity: 1; }
.eye:hover { background: var(--fill-2); color: var(--label); }
.eye .ic { width: 17px; height: 17px; }
.obj-foot { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--sep); color: var(--label-2); font-size: 13.5px; flex: none; }

/* 작업 */
.job-card { padding: 18px; border-radius: var(--r-lg); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--sep); }
.job-head { display: flex; align-items: center; gap: 10px; }
.job-head b { font-size: 16px; font-weight: 700; }
.job-head .el { margin-left: auto; color: var(--label-2); font-size: 15px; font-weight: 700; }
.job-card p { margin-top: 8px; font-size: 14px; line-height: 1.55; }
.job-card .err { color: var(--red-text); font: 12px/1.55 var(--mono); overflow-wrap: anywhere; }
.job-card .btn { margin-top: 14px; }
.jobs { list-style: none; margin: 0 -8px; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.job-row { display: grid; grid-template-columns: 58px minmax(0, 1fr) 40px 44px 18px; align-items: center; gap: 8px; width: 100%; height: 48px; padding: 0 12px; border: 0; border-radius: var(--r-md); background: none; color: var(--label); font-size: 14px; text-align: left; transition: background-color .12s var(--ease), transform .12s var(--ease); }
.job-row > span:first-child { font-weight: 700; }
.job-row:hover:not(:disabled) { background: var(--fill-1); }
.job-row:active:not(:disabled) { transform: scale(.985); }
.job-row:disabled { cursor: default; }
.job-row[aria-pressed="true"] { background: var(--accent-weak); }
.job-row .status { font-size: 13px; }
.job-row .t { color: var(--label-3); text-align: right; font-size: 13px; }
.job-row .k { color: var(--label-3); font-size: 13px; }
.job-row .chk-ic { color: var(--accent); visibility: hidden; stroke-width: 2.4; }
.job-row[aria-pressed="true"] .chk-ic { visibility: visible; }
.open-job { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
.open-job .field { width: 120px; height: 36px; }
.open-job label { color: var(--label-3); font-size: 13.5px; }

/* 수정 기록 */
.hist { list-style: none; margin: 0; padding: 4px 8px 12px; }
.hist-row { display: flex; align-items: center; gap: 12px; padding: 12px 10px 12px 12px; border-radius: var(--r-md); transition: background-color .12s var(--ease); }
.hist-row:hover { background: var(--fill-1); }
.hist-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 0; border: 0; background: none; text-align: left; color: inherit; }
.hist-what { font-size: 15px; font-weight: 600; }
.hist-sub { color: var(--label-3); font-size: 12.5px; }
.hist-row.is-reverted .hist-what { color: var(--label-3); text-decoration: line-through; }
.hist-row .done { color: var(--label-3); font-size: 13px; font-weight: 600; }
.panel-intro { padding: 20px 20px 8px; color: var(--label-2); font-size: 13.5px; line-height: 1.55; }

/* ---------- 메뉴 ---------- */

function josa(word, pair) {
  const w = String(word), ch = w.trim().slice(-1), code = ch.charCodeAt(0);
  let fin; // 0: 받침 없음, 1: 받침 있음, 'l': ㄹ 받침

const SHIRTS = [[188, 62, 60], [52, 82, 140], [216, 216, 210], [38, 38, 42], [200, 160, 64], [70, 128, 108], [146, 108, 168], [226, 120, 62]];
const PANTS = [[30, 34, 46], [50, 50, 56], [82, 72, 60], [40, 60, 90], [22, 22, 26]];
const BLD_PAL = {
  boston: [[146, 84, 66], [122, 96, 80], [176, 160, 136], [132, 134, 138], [96, 112, 128], [158, 148, 138]],
  singapore: [[198, 196, 188], [202, 188, 160], [150, 154, 158], [92, 122, 130], [176, 186, 190], [218, 212, 198]],
};

function buildWorld(meta) {
  const R = mulberry32(hashStr(meta.name + '/world'));
  const rr = (a, b) => a + (b - a) * R();
  const ri = (a, b) => Math.floor(rr(a, b + 1));
  const pick = (arr) => arr[Math.floor(R() * arr.length)];
  const N = meta.frames, side = meta.side, rec = meta.recipe || {};
  const parking = meta.layout === 'parking', highway = meta.layout === 'highway';
  const boston = meta.location.startsWith('boston');
  const W = highway ? 10.5 : parking ? 0 : 8.0;      // 도로 반폭
  const eg = -side;                                   // ego 진행 차로가 있는 쪽의 w 부호
  const egoW = parking ? 0 : eg * 1.75;

  /* ego 속도 프로필 → 진행 거리 s[i] */
  const v0 = { cruise: 8.5, cruiseSlow: 5.2, fast: 13.5, slow: 3.0, stop: 5.5, stopgo: 5.5 }[meta.profile];
  const sp = [];
  for (let i = 0; i < N; i++) {
    let v;
    if (meta.profile === 'stop') v = v0 * Math.max(0, 1 - i / 9);
    else if (meta.profile === 'stopgo') v = i < 9 ? v0 * (1 - i / 9) : i < 22 ? 0 : Math.min(v0, (i - 21) * 0.8);
    else v = v0 * (0.93 + 0.07 * Math.sin(i * 0.35));
    sp.push(v);
  }
  const s = [0];
  for (let i = 1; i < N; i++) s.push(s[i - 1] + 0.25 * (sp[i - 1] + sp[i]));
  const sEnd = s[N - 1];
  const avgV = sEnd / ((N - 1) * 0.5);
  const stopLike = meta.profile === 'stop' || meta.profile === 'stopgo';

  const Wc = 7.5;
  let uX = null;
  if (!parking && meta.tags.includes('intersection')) uX = stopLike ? s[9] + 8.8 + Wc : s[Math.floor(N * 0.55)] + 25;
  const nearX = (u, pad) => uX !== null && Math.abs(u - uX) < Wc + pad;
  const uA = parking ? s[Math.floor(N * 0.5)] + 22 : null; // 주차장 가로 통로

  /* ---- ground (도로 좌표 사각형) ---- */
  const U0 = parking ? -70 : -140, U1 = sEnd + (parking ? 110 : 260);
  const ground = [];
  const rect = (kind, u0, u1, w0, w1) => ground.push({ kind, u0, u1, w0, w1 });
  if (parking) {
    rect('lot', U0, U1, -34, 34);
    for (const sg of [1, -1]) {
      for (const [a, b] of [[3.4, 8.4], [11.4, 16.4]]) {
        const w0 = sg > 0 ? a : -b, w1 = sg > 0 ? b : -a;
        for (let u = Math.ceil(U0 / 2.7) * 2.7; u < U1; u += 2.7) if (Math.abs(u - uA) > 4.2) rect('white', u - 0.06, u + 0.06, w0, w1);
      }
    }
  } else {
    rect('side', U0, U1, W, W + 4.2);
    rect('side', U0, U1, -W - 4.2, -W);
    if (uX !== null) { rect('side', uX - Wc - 4.2, uX + Wc + 4.2, W, 320); rect('side', uX - Wc - 4.2, uX + Wc + 4.2, -320, -W); }
    rect('road', U0, U1, -W, W);
    if (uX !== null) rect('road', uX - Wc, uX + Wc, -320, 320);
    const segs = uX !== null ? [[U0, uX - Wc - 4.6], [uX + Wc + 0.4, U1]] : [[U0, U1]];
    const cl = boston ? 'yellow' : 'white';
    for (const [a, b] of segs) {
      if (!highway) { rect(cl, a, b, -0.2, -0.08); rect(cl, a, b, 0.08, 0.2); }
      for (const lw of highway ? [3.5, 7, -3.5, -7] : [3.5, -3.5]) {
        for (let u = Math.ceil(a / 12) * 12; u < b - 3; u += 12) rect('white', u, u + 3, lw - 0.07, lw + 0.07);
      }
      rect('white', a, b, W - 0.36, W - 0.22);
      rect('white', a, b, -W + 0.22, -W + 0.36);
    }
    if (uX !== null) {
      for (const cw of [uX - Wc - 2.0, uX + Wc + 2.0]) for (let w = -W + 0.6; w < W - 0.6; w += 1.1) rect('white', cw - 1.5, cw + 1.5, w, w + 0.55);
      rect('white', uX - Wc - 4.6, uX - Wc - 4.2, eg > 0 ? 0 : -W, eg > 0 ? W : 0);
    }
  }

  /* ---- statics: 건물, 나무, 가로등 등 (라벨 대상 아님) ---- */
  const pal = boston ? BLD_PAL.boston : BLD_PAL.singapore;
  const hR = boston ? [8, 30] : [10, 46];
  const blds = [], trees = [], lamps = [], barriers = [], cones = [], shelters = [];
  const addBld = (u, w, l, d, h, axis, fs) => blds.push({ u, w, l, d, h, col: pick(pal), axis, fs, seed: (R() * 1e9) | 0, lit: rr(0.18, 0.5) });
  if (!parking) {
    const inner = W + 4.2 + (highway ? 7 : 0);
    for (const sg of [1, -1]) {
      let u = U0;
      while (u < U1) {
        const len = rr(9, 24);
        if (uX !== null && u + len > uX - Wc - 4.2 && u < uX + Wc + 4.2) { u = uX + Wc + 4.2 + rr(0.2, 2); continue; }
        if (R() < 0.1) { u += rr(5, 12); continue; }
        const set = rr(0.3, highway ? 12 : 3.5), dep = rr(10, 20), h = highway ? rr(6, 22) : rr(hR[0], hR[1]);
        addBld(u + len / 2, sg * (inner + set + dep / 2), len - rr(0.4, 1.6), dep, h, 'w', -sg);
        u += len;
      }
    }
    if (uX !== null) {
      for (const su of [-1, 1]) for (const sg of [1, -1]) {
        let w = W + 4.2 + rr(0.5, 2.5);
        while (w < 110) {
          const len = rr(10, 22), dep = rr(10, 18);
          addBld(uX + su * (Wc + 4.2 + rr(0.4, 2) + dep / 2), sg * (w + len / 2), dep, len - rr(0.4, 1.4), rr(hR[0], hR[1]), 'u', -su);
          w += len + rr(0, 3);
        }
      }
    }
  } else {
    for (const sg of [1, -1]) {
      let u = U0;
      while (u < U1 + 60) { const len = rr(14, 30); addBld(u + len / 2, sg * rr(44, 60), len - 2, rr(12, 20), rr(6, 15), 'w', -sg); u += len + rr(2, 14); }
    }
  }
  if (!parking) {
    const sp2 = boston ? [12, 18] : [8, 13];
    for (const sg of [1, -1]) {
      let u = U0 + rr(0, 8);
      while (u < U1) { if (!nearX(u, 6)) trees.push({ u, w: sg * (W + 3.3), th: rr(2.2, 3.0), r: rr(1.6, 2.6), tone: rr(0.8, 1.1) }); u += rr(sp2[0], sp2[1]); }
    }
    let k = 0;
    for (let u = U0 + 10; u < U1; u += 30, k++) { if (nearX(u, 5)) continue; const sg = k % 2 ? 1 : -1; lamps.push({ u, w: sg * (W + 0.5), h: highway ? 10 : 8, arm: -sg }); }
    if (highway) for (let u = U0; u < U1; u += 12) barriers.push({ u: u + 6, w: 0, l: 11.8, d: 0.45, h: 0.85 });
  } else {
    for (const sg of [1, -1]) {
      let u = U0;
      while (u < U1) { trees.push({ u, w: sg * rr(22, 30), th: rr(2.4, 3.4), r: rr(2.0, 3.2), tone: rr(0.75, 1.1) }); u += rr(5, 9); }
    }
    for (let u = U0 + 10; u < U1; u += 24) { lamps.push({ u, w: 10, h: 7, arm: 0 }); lamps.push({ u: u + 12, w: -10, h: 7, arm: 0 }); }
  }

  /* ---- tracks: 라벨 대상 객체 ---- */
  const tracks = [];
  const mk = (cls, pose, extra = {}) => {
    const b = CLASS_DIMS[cls], k = rr(0.94, 1.06);
    const dims = cls === 'pedestrian' ? [b[0] * rr(0.9, 1.05), b[1] * rr(0.9, 1.05), b[2] * rr(0.9, 1.08)] : [b[0] * k, b[1] * rr(0.95, 1.06), b[2] * k];
    let color = pick(VEH_COLORS);
    if (cls === 'construction_vehicle') color = [222, 168, 34];
    if (cls === 'bus') color = pick([[226, 228, 230], [58, 96, 160], [196, 54, 52], [70, 140, 96]]);
    const t = {
      idx: tracks.length, inst: hexToken(`${meta.name}/inst/${tracks.length}`), cls, dims, pose, color,
      cargo: pick([[214, 214, 208], [190, 196, 204], [150, 40, 36], [228, 228, 228]]), shirt: pick(SHIRTS), pants: pick(PANTS), rider: true, ...extra,
    };
    if (extra.rider === false) t.dims[2] = 1.05;
    tracks.push(t);
    return t;
  };
  const follow = (gap, w, yaw = 0) => (i) => ({ u: s[i] + gap, w, yaw });
  const lin = (u0, w0, yaw, v, i0 = 0, i1 = N - 1) => (i) => {
    if (i < i0 || i > i1) return null;
    const t = (i - i0) * 0.5;
    return { u: u0 + Math.cos(yaw) * v * t, w: w0 + Math.sin(yaw) * v * t, yaw };
  };
  const stat = (u, w, yaw) => () => ({ u, w, yaw });
  const cross = (u, w0, dir, v, i0, endW) => (i) => {
    const t = Math.max(0, i - i0) * 0.5;
    const w = w0 + dir * v * t;
    if (Math.abs(w) > endW && Math.sign(w) !== Math.sign(w0)) return null;
    return { u, w, yaw: dir * Math.PI / 2 };
  };
  const lane = (same, k) => (same ? eg : -eg) * [1.75, 5.25, 8.75][k];
  const sideW = (sg) => sg * (W + rr(0.9, 3.4));

  for (let k = 0; k < (rec.follow || 0); k++) mk('car', follow(k === 0 ? rr(10, 12) : rr(20, 26), egoW));
  for (let k = 0; k < (rec.sameLaneFollow || 0); k++) mk('car', follow(rr(1.5, 6), lane(true, 1)));
  for (let k = 0; k < (rec.sameLane || 0); k++) mk(k === 1 ? 'truck' : 'car', lin(-28 + k * 23, lane(true, 1), 0, avgV * 0.96));
  if (rec.trailerSame) {
    const tr = mk('truck', lin(52, lane(true, 1), 0, avgV * 0.96));
    const tl = mk('trailer', () => null);
    const gap = tr.dims[1] / 2 + tl.dims[1] / 2 + 0.6;
    tl.pose = lin(52 - gap, lane(true, 1), 0, avgV * 0.96);
  }
  if (rec.overtake) mk('car', (i) => ({ u: s[i] - 16 + 1.45 * i, w: lane(true, 1), yaw: 0 }));
  if (rec.sameTruck) mk('truck', follow(rr(30, 36), egoW));

  const oncLanes = rec.parkedTruck ? [0] : highway ? [0, 1, 2] : [0, 1];
  for (let k = 0; k < (rec.oncoming || 0); k++) {
    const w0 = lane(false, oncLanes[k % oncLanes.length]);
    const cls = R() < 0.12 ? 'truck' : 'car';
    if (stopLike) {
      const qU = uX + Wc + 5 + Math.floor(k / oncLanes.length) * rr(7, 9);
      const goI = meta.profile === 'stopgo' ? 22 : N + 1, vq = rr(5, 7);
      mk(cls, (i) => ({ u: i < goI ? qU : qU - vq * (i - goI) * 0.5, w: w0, yaw: Math.PI }));
    } else {
      mk(cls, lin(rr(15, sEnd + 160), w0, Math.PI, rr(7, 11)));
    }
  }
  if (rec.oncomingBus) {
    if (stopLike) {
      const qU = uX + Wc + 24, goI = meta.profile === 'stopgo' ? 22 : N + 1;
      mk('bus', (i) => ({ u: i < goI ? qU : qU - 5.5 * (i - goI) * 0.5, w: lane(false, 0), yaw: Math.PI }));
    } else mk('bus', lin(rr(50, sEnd + 70), lane(false, 0), Math.PI, 7));
  }
  if (rec.parked) {
    const slots = [];
    for (let u = s[0] - 30; u < sEnd + 70; u += 7.2) if (!nearX(u, 10)) slots.push(u);
    for (let k = 0; k < rec.parked && slots.length; k++) {
      const u = slots.splice(Math.floor(R() * slots.length), 1)[0] + rr(-0.6, 0.6);
      const sg = rec.cyclists ? -eg : (R() < 0.5 ? 1 : -1);
      mk(R() < 0.15 ? 'truck' : 'car', stat(u, sg * (W - 0.45 - (R() < 0.15 ? 0.6 : 0)), sg === eg ? 0 : Math.PI));
    }
  }
  if (rec.parkedTruck) {
    const t = mk('truck', stat(8, -eg * (W - 1.3), Math.PI));
    const tl = mk('trailer', () => null);
    tl.pose = stat(8 + t.dims[1] / 2 + tl.dims[1] / 2 + 0.4, -eg * (W - 1.3), Math.PI);
  }
  for (let k = 0; k < (rec.sidewalkPeds || 0); k++) {
    const sg = rec.sidewalkBias ? (R() < 0.82 ? rec.sidewalkBias : -rec.sidewalkBias) : (R() < 0.5 ? 1 : -1);
    const w = parking ? sg * rr(17.5, 19.5) : sideW(sg);
    const still = R() < 0.2, yaw = R() < 0.5 ? 0 : Math.PI;
    mk('pedestrian', lin(rr(s[0] - 20, sEnd + 45), w, still ? -sg * Math.PI / 2 : yaw, still ? 0 : rr(0.9, 1.5)));
  }
  if (uX !== null) {
    for (let k = 0; k < (rec.crossingPeds || 0); k++) {
      const sg = R() < 0.5 ? 1 : -1, near = meta.profile === 'stop';
      const cw = (near ? uX - Wc - 2.0 : uX + Wc + 2.0) + rr(-1.1, 1.1);
      const i0 = near ? ri(1, 16) : ri(0, 6);
      mk('pedestrian', cross(cw, sg * (W + rr(0.8, 2.4)), -sg, near ? rr(1.0, 1.45) : rr(1.45, 1.7), i0, W + 2.6));
    }
    const crossVeh = (cls, k, i0) => {
      const dir = k % 2 ? 1 : -1;
      mk(cls, lin(uX + dir * side * 1.75, -dir * 48, dir * Math.PI / 2, rr(7.5, 9.5), i0, N - 1));
    };
    for (let k = 0; k < (rec.crossTraffic || 0); k++) crossVeh('car', k, meta.profile === 'stopgo' ? ri(0, 6) : ri(0, N - 22));
    if (rec.crossTruck) crossVeh('truck', 1, ri(6, 14));
  }
  for (let k = 0; k < (rec.jaywalkers || 0); k++) {
    const i0 = ri(3, 14), sg = R() < 0.5 ? 1 : -1, halfW = parking ? 3.6 : W;
    mk('pedestrian', cross(s[i0] + (parking ? rr(12, 20) : rr(15, 24)), sg * (halfW + 1.0), -sg, rr(1.3, 1.7), i0, halfW + 2));
  }
  for (let k = 0; k < (rec.cyclists || 0); k++) mk('bicycle', lin(rr(-6, 30), eg * 6.15, 0, rr(3.6, 5.0)));
  for (let k = 0; k < (rec.parkedBikes || 0); k++) mk('bicycle', stat(s[Math.floor(N * 0.45)] + 8 + k * 0.85, -eg * (W + 0.7), Math.PI / 2), { rider: false });
  for (let k = 0; k < (rec.motorcycles || 0); k++) {
    if (stopLike) mk('motorcycle', follow(rr(-2, 4), lane(true, 1) + eg * 0.5));
    else if (k % 2 === 0) mk('motorcycle', lin(rr(-10, 30), lane(true, 1) + eg * rr(-0.5, 0.5), 0, avgV + rr(0.6, 2.4)));
    else mk('motorcycle', lin(rr(20, sEnd + 100), lane(false, 1), Math.PI, rr(7, 10)));
  }
  if (rec.construction) {
    const cu = highway ? s[Math.floor(N * 0.6)] + 30 : s[0] - 4;
    mk('construction_vehicle', stat(cu, eg * (W + 0.4), 0));
    for (let k = -3; k <= 3; k++) cones.push({ u: cu + k * 3.2, w: eg * (W - 1.2) });
  }
  if (rec.busStop) {
    const bu = s[Math.floor(N * 0.45)] + 25;
    shelters.push({ u: bu - 4, w: eg * (W + 2.6), l: 5, d: 1.6, h: 2.6 });
    mk('bus', stat(bu, eg * (W - 1.6), 0));
    for (let k = 0; k < 3; k++) mk('pedestrian', stat(bu - 6 + k * 1.3, eg * (W + 1.5), -eg * Math.PI / 2));
  }
  if (rec.aisleBus) mk('bus', lin(uA, -38, Math.PI / 2, 4.2, ri(4, 10)));
  if (rec.parkedLot) {
    for (const sg of [1, -1]) {
      for (const [wc, p] of [[5.9, rec.parkedLot], [13.9, rec.parkedLot * 0.5]]) {
        for (let u = Math.ceil((s[0] - 25) / 2.7) * 2.7 + 1.35; u < sEnd + 40; u += 2.7) {
          if (Math.abs(u - uA) < 5.5 || R() > p) continue;
          mk('car', stat(u, sg * wc, (R() < 0.5 ? 1 : -1) * Math.PI / 2));
        }
      }
    }
  }

  const h0 = rr(-Math.PI, Math.PI), ox = rr(300, 2000), oy = rr(600, 2400);
  const t0 = 1531880000000000 + Math.floor(R() * 9e8) * 1000;
  return { meta, N, s, sp, W, Wc, uX, uA, egoW, eg, side, ground, blds, trees, lamps, barriers, cones, shelters, tracks, h0, ox, oy, t0, parking, highway, boston };
}

function roadToWorld(w, u, v) {
  const c = Math.cos(w.h0), sn = Math.sin(w.h0);
  return [w.ox + u * c - v * sn, w.oy + u * sn + v * c];
}
function egoPoseAt(w, i) {
  const [x, y] = roadToWorld(w, w.s[i], w.egoW);
  return { translation: [x, y, 0], rotation: yawToQuat(w.h0), timestamp: w.t0 + i * 500000 };
}
function trackBoxAt(w, t, i) {
  const p = t.pose(i);
  if (!p) return null;
  const [x, y] = roadToWorld(w, p.u, p.w);
  return { translation: [x, y, t.dims[2] / 2], size: [...t.dims], rotation: yawToQuat(w.h0 + p.yaw) };
}


/* =============================================================================
 * 3. adapter — Spring /api/* 계약을 흉내 내는 데이터 경계
 * [React: src/api/adapter.ts] 화면과 store는 `api` 객체의 메서드만 씁니다.
 * 목업은 네트워크 요청을 보내지 않습니다. 아래 HttpAdapter는 실제 연결용 fetch 초안입니다.
 *
 * 기존 계약
 *   GET  /api/datasets/{id}/scenes             getScenes
 *   GET  /api/scenes/{sceneId}/samples          getSamples
 *   GET  /api/samples/{sampleId}                getSample
 *   GET  /api/samples/{sampleId}/annotations    getAnnotations     ← label·originalLabel·edited 필드 추가 필요
 *   GET  /api/sensor-files/{id}/pose|calibration|content
 *   GET  /api/search/scenes?q=&datasetId=&k=    searchScenes       ← score(0.xx) 반영
 *   POST /api/auto-label/jobs                   createJob
 *   GET  /api/auto-label/jobs/{jobId}           getJob
 *   GET  /api/auto-label/jobs/{jobId}/results   getJobResults      ← 예측마다 id·edited 필드 추가 필요
 * 이번 리뉴얼에서 새로 필요한 계약 (백엔드_수정사항.md 참고)
 *   PATCH  /api/annotations/{id}                updateAnnotation   {label, scope: SAMPLE|INSTANCE}
 *   DELETE /api/annotations/{id}?scope=         deleteAnnotation
 *   PATCH  /api/auto-label/predictions/{id}     updatePrediction   {label}
 *   DELETE /api/auto-label/predictions/{id}     deletePrediction
 *   GET    /api/scenes/{sceneId}/label-edits    getLabelEdits      ?jobId=
 *   POST   /api/label-edits/{editId}/revert     revertEdit
 *   GET    /api/auto-label/jobs?sceneToken=     listJobs           (이미 있으면 그대로)
 * ========================================================================== */
const MockBackend = (() => {
  const JOB_KEY = 'ds2l.renew.v1.jobs', EDIT_KEY = 'ds2l.renew.v1.edits';
  const scenes = SCENE_CATALOG.map((m, k) => ({
    id: 101 + k, datasetId: DATASET_ID, sceneToken: hexToken(m.name + '/scene'), name: m.name, description: m.desc,
    nbrSamples: m.frames, location: m.location, _tags: m.tags,
  }));
  const byId = new Map(scenes.map((s) => [s.id, s]));
  const byToken = new Map(scenes.map((s) => [s.sceneToken, s]));
  const worlds = new Map();
  const world = (name) => { if (!worlds.has(name)) worlds.set(name, buildWorld(CATALOG_BY_NAME[name])); return worlds.get(name); };
  const sampleId = (scene, i) => scene.id * 1000 + i;
  const sampleToken = (name, i) => hexToken(`${name}/sample/${i}`);
  const decodeSample = (sid) => { const scene = byId.get(Math.floor(sid / 1000)); if (!scene) return null; const i = sid % 1000; return i < scene.nbrSamples ? { scene, i } : null; };
  const LIDAR_SLOT = 9;
  const fileId = (sid, slot) => sid * 10 + slot;
  const ANN_K = 1000, PRED_K = 1000000;
  let flags = { slowLoad: false, missingCam: false, failNext: false, searchError: false, envUnverified: false, editError: false };
  let jobs = (safeStore.get(JOB_KEY) || []).filter((j) => j && j.jobId && byToken.has(j.sceneToken));
  let ed = safeStore.get(EDIT_KEY);
  if (!ed || typeof ed !== 'object' || !ed.ov || !Array.isArray(ed.log)) ed = { ov: {}, log: [], seq: 0 };
  let envCheckedAt = Date.now();
  const saveJobs = () => safeStore.set(JOB_KEY, jobs);
  const saveEd = () => safeStore.set(EDIT_KEY, ed);
  const lat = (ms) => sleep(ms * (0.75 + Math.random() * 0.5));
  const httpError = (status, message) => Object.assign(new Error(message), { status });
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const r6 = (v) => Math.round(v * 1e6) / 1e6;

  function isMissing(name, i, ch) {
    if (flags.missingCam && ch === 'CAM_BACK_LEFT') return true;
    const m = CATALOG_BY_NAME[name].missing;
    return !!(m && m.ch === ch && i >= m.from && i <= m.to);
  }

  /* ---------- 수정 상태 (서버의 label_override 테이블 역할) ---------- */
  function state(type, id, base) {
    const o = ed.ov[`${type}:${id}`];
    const label = o && o.label ? o.label : base;
    return { label, edited: label !== base, deleted: !!(o && o.deleted) };
  }
  function setOv(key, patch, base) {
    const o = { ...(ed.ov[key] || {}), ...patch };
    if (!o.label || o.label === base) delete o.label;
    if (!o.deleted) delete o.deleted;
    if (Object.keys(o).length) ed.ov[key] = o; else delete ed.ov[key];

  const snapshot = (keys) => Object.fromEntries(keys.map((k) => [k, ed.ov[k] ? { ...ed.ov[k] } : null]));
  function conflictOf(entry) {
    const keys = Object.keys(entry.prev || {});
    return ed.log.some((e) => e.id > entry.id && !e.revertedAt && Object.keys(e.prev || {}).some((k) => keys.includes(k)));
  }
  function editDto(e) {
    return {
      id: e.id, sceneId: e.sceneId, jobId: e.jobId, targetType: e.targetType, targetIds: e.targetIds, sampleIds: e.sampleIds,
      instanceToken: e.instanceToken || null, action: e.action, fromLabel: e.fromLabel, toLabel: e.toLabel || null,
      scope: e.scope, count: e.targetIds.length, createdAt: e.createdAt, revertedAt: e.revertedAt,
      revertible: !e.revertedAt && !conflictOf(e),
    };
  }
  function log(entry) {
    entry.id = ++ed.seq;
    entry.createdAt = new Date().toISOString();
    entry.revertedAt = null;
    ed.log.push(entry);
    ed.log = ed.log.slice(-400);
    saveEd();
    return entry;
  }
  function maybeEditError() { if (flags.editError) throw httpError(500, '서버가 잠시 응답하지 않아요 (예시 오류)'); }

  /* ---------- GT ---------- */
  function present(w, t, i) {
    const p = t.pose(i);
    if (!p) return false;
    const du = p.u - w.s[i], dw = p.w - w.egoW;
    return du * du + dw * dw <= 50 * 50;
  }
  function annDto(scene, i, t) {
    const sid = sampleId(scene, i), id = sid * ANN_K + t.idx, b = trackBoxAt(world(scene.name), t, i), st = state('ANNOTATION', id, t.cls);
    return {
      id, sampleId: sid, instanceToken: t.inst, category: NUSC_CATEGORY[t.cls],
      label: st.label, originalLabel: t.cls, edited: st.edited, deleted: st.deleted,
      translation: b.translation.map(r3), size: b.size.map(r3), rotation: b.rotation.map(r6),
    };
  }
  function annotationsFor(scene, i, includeDeleted) {
    const w = world(scene.name), out = [];
    for (const t of w.tracks) {
      if (!present(w, t, i)) continue;
      const a = annDto(scene, i, t);
      if (a.deleted && !includeDeleted) continue;
      out.push(a);
    }
    return out;
  }
  function findAnnotation(id) {
    const d = decodeSample(Math.floor(id / ANN_K));
    if (!d) return null;
    const w = world(d.scene.name), t = w.tracks[id % ANN_K];
    return t && present(w, t, d.i) ? { scene: d.scene, i: d.i, t } : null;
  }
  function instanceAnnIds(scene, t) {
    const w = world(scene.name), ids = [];
    for (let i = 0; i < w.N; i++) if (present(w, t, i)) ids.push(sampleId(scene, i) * ANN_K + t.idx);
    return ids;
  }

  /* ---------- 작업과 예측 ---------- */
  function jobView(j, now = Date.now()) {
    const el = now - j.createdAt;
    let status = 'PENDING', startedAt = null, finishedAt = null, errorMessage = null;
    if (el >= j._pendingMs) { status = 'RUNNING'; startedAt = j.createdAt + j._pendingMs; }
    if (el >= j._pendingMs + j._runMs) {

      finishedAt = j.createdAt + j._pendingMs + j._runMs;
      if (j._fail) errorMessage = 'VESPA inference worker exited: CUDA out of memory (예시 오류)';
    }
    const iso = (t) => (t ? new Date(t).toISOString() : null);
    return { jobId: j.jobId, sceneToken: j.sceneToken, datasetId: j.datasetId, classMode: j.classMode, status, createdAt: iso(j.createdAt), startedAt: iso(startedAt), finishedAt: iso(finishedAt), errorMessage };
  }
  const predCache = new Map();
  function basePredictions(j) {
    if (predCache.has(j.jobId)) return predCache.get(j.jobId);
    const scene = byToken.get(j.sceneToken), w = world(scene.name);
    const R = mulberry32(hashStr('pred/' + j.jobId + '/' + j.classMode));
    const map = MODE_LABEL[j.classMode], preds = [];
    const push = (i, label, tr, sz, rot) => preds.push({
      id: j.jobId * PRED_K + preds.length, datasetId: j.datasetId, sampleToken: sampleToken(scene.name, i), label, detectionScore: 1.0,
      translation: tr.map(r3), size: sz.map(r3), rotation: rot.map(r6), _frame: i,
    });
    for (let i = 0; i < w.N; i++) {
      for (const t of w.tracks) {
        const p = t.pose(i);
        if (!p) continue;
        const d = Math.hypot(p.u - w.s[i], p.w - w.egoW);
        if (d > 50) continue;
        const label = map ? map[t.cls] : t.cls;
        if (!label) continue;
        const trackMiss = (hashStr(j.jobId + t.inst) % 100) < 7;

        const yaw = quatToYaw(b.rotation) + (R() - 0.5) * 0.18 * n;
        const tr = [b.translation[0] + (R() - 0.5) * 0.7 * n, b.translation[1] + (R() - 0.5) * 0.7 * n, b.translation[2] + (R() - 0.5) * 0.16];
        const wrongCls = !map && R() < 0.04 ? (t.cls === 'car' ? 'truck' : t.cls === 'truck' ? 'bus' : t.cls) : label;
        push(i, wrongCls, tr, b.size.map((v) => v * (1 + (R() - 0.5) * 0.12)), yawToQuat(yaw));

        const u = w.s[i] + 9 + R() * 30, v = w.egoW + (R() - 0.5) * (w.parking ? 10 : 2 * w.W);
        const [x, y] = roadToWorld(w, u, v), sz = CLASS_DIMS.car;

  }
  function findPrediction(id) {

  /* ---------- 검색 ---------- */
  function searchMock(q, k) {

    const concepts = new Set(), nameHits = new Set();
    const hangul = (s) => /[가-힣]/.test(s);
    for (const tk of toks) {
      for (const [c, syns] of Object.entries(SEARCH_SYNONYMS)) if (syns.some((sy) => tk === sy || (hangul(sy) && tk.includes(sy)))) concepts.add(c);
      for (const s of scenes) if (tk.length >= 3 && /\d/.test(tk) && s.name.includes(tk)) nameHits.add(s.name);
    }
    if (!concepts.size && !nameHits.size) return { query: q, items: [] };
    const df = (c) => scenes.filter((s) => s._tags.includes(c)).length || 0.5;
    const wOf = (c) => Math.log(1 + scenes.length / df(c));
    const total = [...concepts].reduce((a, c) => a + wOf(c), 0);
    const items = scenes.map((s) => {
      const frac = total ? [...concepts].filter((c) => s._tags.includes(c)).reduce((a, c) => a + wOf(c), 0) / total : 0;
      const named = nameHits.has(s.name);
      if (!named && frac < 0.3) return null;
      const jitter = ((hashStr(q + s.name) % 1000) / 1000 - 0.5) * 0.03;
      const score = named ? 0.312 + jitter * 0.3 : 0.118 + 0.21 * frac + jitter; // 임베딩 코사인 유사도처럼 0.1–0.35 범위
      return { sceneId: s.id, sceneToken: s.sceneToken, name: s.name, description: s.description, nbrSamples: s.nbrSamples, score: Math.round(score * 10000) / 10000 };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, k);
    return { query: q, items };

  const api = {
    async getDatasets() { await lat(80); return [{ id: DATASET_ID, name: 'nuScenes', version: 'v1.0-mini', sceneCount: scenes.length }]; },
    async getScenes(datasetId) { await lat(flags.slowLoad ? 1600 : 140); return scenes.filter((s) => s.datasetId === datasetId).map(({ _tags, ...s }) => s); },
    async getSamples(sceneId, { limit = 100, offset = 0 } = {}) {
      await lat(flags.slowLoad ? 2200 : 180);
      const scene = byId.get(sceneId);
      if (!scene) throw httpError(404, `scene ${sceneId} not found`);
      const w = world(scene.name), items = [];
      for (let i = offset; i < Math.min(w.N, offset + limit); i++) items.push({ id: sampleId(scene, i), sampleToken: sampleToken(scene.name, i), sceneId, timestamp: w.t0 + i * 500000, frameIndex: i });
      return { items, total: w.N, limit, offset };
    },
    async getSample(sid) {
      await lat(40);

        .concat([{ id: fileId(sid, LIDAR_SLOT), channel: 'LIDAR_TOP', modality: 'lidar', fileFormat: 'pcd.bin' }]);

    },
    async getAnnotations(sid, { includeDeleted = false } = {}) {

    },
    async getSensorPose(fid) {

    /** 실제: `/api/sensor-files/${id}/content`. 목업은 합성 이미지를 그리므로 쓰지 않습니다. */
    sensorContentUrl(fid) { return `/api/sensor-files/${fid}/content`; },
    async searchScenes(q, { datasetId = DATASET_ID, k = 10 } = {}) {

    },

    async getEnvironment() { await lat(120); return { status: flags.envUnverified ? 'UNVERIFIED' : 'READY', runtime: 'local', checkedAt: flags.envUnverified ? null : new Date(envCheckedAt).toISOString() }; },
    async checkEnvironment() { await lat(900); flags.envUnverified = false; envCheckedAt = Date.now(); return { status: 'READY', runtime: 'local', checkedAt: new Date(envCheckedAt).toISOString() }; },
    async listJobs(sceneToken) { await lat(120); return jobs.filter((j) => j.sceneToken === sceneToken).map((j) => jobView(j)).sort((a, b) => b.jobId - a.jobId); },
    async createJob(body) {

      if (![1, 3, 8].includes(body.classMode)) throw httpError(400, 'classMode는 1, 3, 8 중 하나여야 해요');

      if (jobs.some((j) => j.sceneToken === scene.sceneToken && !['COMPLETED', 'FAILED'].includes(jobView(j).status))) throw httpError(409, '이 씬에서 이미 작업이 진행 중이에요');

    async getJob(jobId) {
      await lat(90);
      const j = jobs.find((x) => x.jobId === jobId);
      if (!j) throw httpError(404, `작업 #${jobId}을 찾을 수 없어요`);
      return jobView(j);
    },
    async getJobResults(jobId, { includeDeleted = false } = {}) {
      await lat(300);
      const j = jobs.find((x) => x.jobId === jobId);
      if (!j) throw httpError(404, `job ${jobId} not found`);
      if (jobView(j).status !== 'COMPLETED') throw httpError(409, 'job is not completed');
      const predictions = basePredictions(j).map(predDto).filter((p) => includeDeleted || !p.deleted);

    /* ---------- 객체 수정 (신규) ---------- */

    },
    async updatePrediction(id, body = {}) {
      await lat(160); maybeEditError();
      const ref = findPrediction(id);

      if (!LABEL_OPTIONS.includes(body.label)) throw httpError(400, `label은 ${LABEL_OPTIONS.join(', ')} 중 하나여야 해요`);
      const st = state('PREDICTION', id, ref.p.label);
      if (st.deleted) throw httpError(409, '삭제된 박스는 이름을 바꿀 수 없어요');

      return { edit: editDto(e) };
    },
    async getLabelEdits(sceneId, { jobId = null } = {}) {
      await lat(110);
      return ed.log.filter((e) => e.sceneId === sceneId && (e.targetType === 'ANNOTATION' || e.jobId === jobId)).sort((a, b) => b.id - a.id).slice(0, 100).map(editDto);
    },
    async revertEdit(editId) {
      await lat(160); maybeEditError();
      const e = ed.log.find((x) => x.id === editId);
      if (!e) throw httpError(404, `edit ${editId} not found`);
      if (e.revertedAt) throw httpError(409, '이미 되돌린 수정이에요');
      if (conflictOf(e)) throw httpError(409, '같은 객체에 나중 수정이 있어요. 최근 수정부터 되돌려 주세요');
      for (const [k, v] of Object.entries(e.prev)) { if (v) ed.ov[k] = v; else delete ed.ov[k]; }
      e.revertedAt = new Date().toISOString();

    },
  };

  return {
    api,
    setFlags(f) { flags = { ...flags, ...f }; },
    flags: () => ({ ...flags }),
    resetAll() { jobs = []; ed = { ov: {}, log: [], seq: 0 }; predCache.clear(); safeStore.del(JOB_KEY); safeStore.del(EDIT_KEY); },
    /** 합성 센서 렌더러 전용 접근. 실제 제품에는 없습니다. */

  };
})();

/** 실제 백엔드 연결용 fetch 초안. 목업에서는 쓰지 않습니다. 응답 필드명은 백엔드와 맞춰 확인해야 합니다. */
const HttpAdapter = (base = '/api') => {
  const call = async (path, init) => {
    const r = await fetch(base + path, { headers: { 'Content-Type': 'application/json' }, ...init });
    if (!r.ok) {
      let msg = r.statusText;
      try { const b = await r.json(); msg = b.message || msg; } catch (e) { /* 본문 없음 */ }
      throw Object.assign(new Error(msg), { status: r.status });
    }
    return r.status === 204 ? null : r.json();
  };
  const body = (method, b) => ({ method, body: JSON.stringify(b) });
  return {
    getDatasets: () => call('/datasets'),
    getScenes: (id) => call(`/datasets/${id}/scenes`),
    getSamples: (sceneId, { limit = 100, offset = 0 } = {}) => call(`/scenes/${sceneId}/samples?limit=${limit}&offset=${offset}`),
    getSample: (id) => call(`/samples/${id}`),
    getAnnotations: (id, { includeDeleted = false } = {}) => call(`/samples/${id}/annotations${includeDeleted ? '?includeDeleted=true' : ''}`),
    getSensorPose: (id) => call(`/sensor-files/${id}/pose`),
    getSensorCalibration: (id) => call(`/sensor-files/${id}/calibration`),
    sensorContentUrl: (id) => `${base}/sensor-files/${id}/content`,
    searchScenes: (q, { datasetId = DATASET_ID, k = 10 } = {}) => call(`/search/scenes?q=${encodeURIComponent(q)}&datasetId=${datasetId}&k=${k}`),
    getEnvironment: () => call('/auto-label/environment'),

/* =============================================================================
 * 4. projection — 예시 좌표 변환·투영
 * [React: src/lib/projection/demoProjection.ts]
 * 이 시안의 체인: WORLD → ego(ego pose 역변환, yaw만) → camera(예시 보정값, yaw만) → image(intrinsic)

 * (x 오른쪽, y 아래, z 전방)을 써야 하므로 이 모듈을 그대로 쓰면 안 됩니다.
 * ========================================================================== */

  NEAR: 0.4,
  EDGES: [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]],

    const dx = p[0] - ego.translation[0], dy = p[1] - ego.translation[1];

  },
  /** 박스(WORLD, size W/L/H, quaternion) → ego 좌표 박스 */
  boxToEgo(box, ego) {
    return { center: this.worldToEgo(box.translation, ego), size: box.size, yaw: wrapAngle(quatToYaw(box.rotation) - quatToYaw(ego.rotation)) };
  },
  /** 0–3 바닥(0,1이 앞면), 4–7 윗면 */
  corners(eb) {

    return [rx * c + ry * s, -rx * s + ry * c, p[2] - tz]; // [전방, 왼쪽, 위]
  },
  camToImage(q, calib) { const K = calib.cameraIntrinsic; return [K[0][2] - K[0][0] * q[1] / q[0], K[1][2] - K[1][1] * q[2] / q[0]]; },

  },
  isVisible(center, calib) {
    const q = this.egoToCam(center, calib);
    if (q[0] < 0.8) return false;
    const [x, y] = this.camToImage(q, calib);

  },
};

const LidarSim = (() => {

    const key = world.meta.name + '|' + i;
    if (cache.has(key)) return cache.get(key);
    const s = world.s[i], ew = world.egoW, obs = [];
    const add = (u, w, l, wd, yb, h, kind) => {
      const x = u - s, y = w - ew, r = Math.hypot(l, wd) / 2;
      if (Math.hypot(x - O[0], y) - r > 72) return;
      obs.push({ x, y, hl: l / 2, hw: wd / 2, c: Math.cos(yb), s: Math.sin(yb), h, r, kind });

    for (const b of world.barriers) add(b.u, b.w, b.l, b.d, 0, b.h, 2);
    for (const sh of world.shelters) add(sh.u, sh.w, sh.l, sh.d, 0, sh.h, 2);

      if (world.parking) return 0;
      const u = x + s, w = y + ew;
      if (world.uX !== null && Math.abs(u - world.uX) < world.Wc) return 0;
      return Math.abs(w) > world.W ? 0.13 : 0;

})();

  const line = (pts) => { let on = false; ctx.beginPath(); for (const q of pts) { const s = proj(q[0], q[1], q[2]); if (!s) { on = false; continue; } if (on) ctx.lineTo(s[0], s[1]); else { ctx.moveTo(s[0], s[1]); on = true; } } ctx.stroke(); };

  ctx.font = `500 ${10 * px}px ${FONT_STACK}`; ctx.fillStyle = 'rgba(200,200,206,.5)';
  for (const r of [10, 20, 30, 40]) { const lp = proj(r, 0, 0); if (lp) ctx.fillText(`${r} m`, lp[0] + 4 * px, lp[1] - 3 * px); }
  const { pts, n } = SensorSource.lidar(scene, v.frame), bins = BIN_COLORS.map(() => []);
  for (let k = 0; k < n; k++) {
    const x = pts[k * 4], y = pts[k * 4 + 1], z = pts[k * 4 + 2], s = proj(x, y, z);
    if (!s || s[0] < -2 || s[0] > W + 2 || s[1] < -2 || s[1] > H + 2) continue;

  }
  const sz = Math.max(1, 1.4 * px);
  bins.forEach((arr, b) => { ctx.fillStyle = BIN_COLORS[b]; for (let j = 0; j < arr.length; j += 2) ctx.fillRect(arr[j] - sz / 2, arr[j + 1] - sz / 2, sz, sz); });

  ctx.strokeStyle = 'rgba(240,242,244,.6)'; ctx.lineWidth = 1.5 * px;
  line([[3.6, 0, 0.02], [6.4, 0, 0.02]]); line([[5.6, 0.6, 0.02], [6.4, 0, 0.02], [5.6, -0.6, 0.02]]);
  const axis = (to, col, lbl) => { ctx.strokeStyle = col; ctx.lineWidth = 2 * px; line([[0, 0, 0.03], to]); const s = proj(to[0], to[1], to[2]); if (s) { ctx.fillStyle = col; ctx.font = `700 ${10.5 * px}px ${MONO_STACK}`; ctx.fillText(lbl, s[0] + 3 * px, s[1] - 3 * px); } };
  axis([3, 0, 0.03], '#ff6b63', 'X'); axis([0, 3, 0.03], '#5fd17a', 'Y'); axis([0, 0, 3], '#5aa7ff', 'Z');
  const sel = v.selected, items = visibleItems(scene, v.frame).sort((a, b) => (a.key === sel) - (b.key === sel));
  for (const it of items) {
    const isSel = it.key === sel;
    ctx.globalAlpha = sel && !isSel ? 0.45 : 1;
    drawBox3(ctx, proj, it.eb, COLORS[it.type], it.type === 'gt' ? [5 * px, 3.5 * px] : [], (isSel ? 2.6 : 1.4) * px, null, isSel);
    const c = proj(it.eb.center[0], it.eb.center[1], it.eb.center[2]);
    if (c) p.hits.push({ key: it.key, x: c[0] / px, y: c[1] / px, r: Math.max(10, (foc * Math.max(it.eb.size[0], it.eb.size[1]) * 0.6) / c[2] / px) });
  }
  ctx.globalAlpha = 1;
  const si = items.find((it) => it.key === sel);
  if (si && store.layers.names) { const top = proj(si.eb.center[0], si.eb.center[1], si.eb.center[2] + si.eb.size[2] / 2 + 0.4); if (top) drawTag(ctx, si.label, si.type, top[0] - 20 * px, top[1], 'above', px, W, H, true); }
  const cnt = $('.v3d-count', p.el);
  if (cnt) cnt.textContent = `${n.toLocaleString('ko-KR')}점`;
}

/** 슬라이더 위 띠: 예측이 있는 프레임(파랑), 선택한 GT 객체가 보이는 프레임(노랑) */
function drawStrip(cv, name) {
  const d = window.devicePixelRatio || 1, w = Math.max(1, Math.round(cv.clientWidth * d)), h = Math.round(5 * d), sd = Q.sceneData[name];
  if (cv.width !== w) cv.width = w;
  if (cv.height !== h) cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  if (!sd || sd.status !== 'ready') return;
  const N = sd.samples.length, cw = w / N, shown = displayedResult(name);
  if (shown && shown.res && shown.res.status === 'ready' && store.layers.pred) {
    ctx.fillStyle = COLORS.pred;
    sd.samples.forEach((s, k) => { if (shown.res.byKey.has(`${sd.scene.datasetId}:${s.sampleToken}`)) ctx.fillRect(k * cw + 0.5, h * 0.6, Math.max(1, cw - 1), h * 0.4); });
  }
  const sel = viewOf(name).selected;
  if (sel && sel.startsWith('gt:')) {
    const inst = sel.slice(3);
    ctx.fillStyle = COLORS.gt;
    sd.samples.forEach((s, k) => { if (s.anns.some((a) => a.instanceToken === inst)) ctx.fillRect(k * cw + 0.5, 0, Math.max(1, cw - 1), h * 0.45); });
  }
}

}
function mountDividers(root) {
  for (const d of $$('.divider', root)) {
    const split = d.parentElement, id = d.dataset.divider, orient = split.dataset.orient;
    const get = () => { const r = splitRatioOf(id); return r == null ? autoRatio(split, orient) : r; };
    const set = (r, save) => {
      r = clamp(r, 0.25, id === 'compare' ? 0.75 : 0.8);
      if (id === 'compare') store.compare.ratio = r; else viewOf(id).split = r;
      split.style.setProperty('--ratio', r);
      d.setAttribute('aria-valuenow', String(Math.round(r * 100)));
      if (save) persist();
    };
    d.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      d.setPointerCapture(e.pointerId);
      d.classList.add('is-dragging');
      const rect = split.getBoundingClientRect();
      const mv = (ev) => set(orient === 'stack' ? (ev.clientY - rect.top - 4.5) / (rect.height - 9) : (ev.clientX - rect.left - 4.5) / (rect.width - 9));
      const up = () => { d.classList.remove('is-dragging'); d.removeEventListener('pointermove', mv); d.removeEventListener('pointerup', up); d.removeEventListener('pointercancel', up); persist(); };
      d.addEventListener('pointermove', mv);
      d.addEventListener('pointerup', up);
      d.addEventListener('pointercancel', up);
    });
    d.addEventListener('dblclick', () => resetSplit(id));
    d.addEventListener('keydown', (e) => {
      const step = e.shiftKey ? 0.08 : 0.02, dec = orient === 'stack' ? 'ArrowUp' : 'ArrowLeft', inc = orient === 'stack' ? 'ArrowDown' : 'ArrowRight';
      if (e.key === dec) set(get() - step, true);
      else if (e.key === inc) set(get() + step, true);
      else if (e.key === 'Home') set(0.25, true);
      else if (e.key === 'End') set(0.8, true);
      else if (e.key === 'Enter') resetSplit(id);
      else return;
      e.preventDefault(); e.stopPropagation();
    });
  }
}

/** 다시 그릴 때 포커스, 스크롤, 펼침, 입력 중인 값을 보존합니다. */
function patch(el, html) {
  if (!el || el._html === html) return;
  const ae = document.activeElement, fk = ae && el.contains(ae) ? ae.getAttribute('data-fk') : null;
  const scrolls = {};
  $$('[data-scroll]', el).forEach((s) => { scrolls[s.dataset.scroll] = s.scrollTop; });
  const open = $$('details[open]', el).map((d) => d.dataset.k);
  const keep = {};
  $$('[data-keep]', el).forEach((x) => { keep[x.dataset.keep] = x.type === 'checkbox' ? x.checked : x.value; });
  el.innerHTML = html;
  el._html = html;
  $$('[data-keep]', el).forEach((x) => { const k = x.dataset.keep; if (k in keep) { if (x.type === 'checkbox') x.checked = keep[k]; else x.value = keep[k]; } });
  $$('[data-scroll]', el).forEach((s) => { if (scrolls[s.dataset.scroll] != null) s.scrollTop = scrolls[s.dataset.scroll]; });
  open.forEach((k) => { const d = $(`details[data-k="${k}"]`, el); if (d) d.open = true; });
  if (fk) { const n = $(`[data-fk="${CSS.escape(fk)}"]`, el); if (n) n.focus({ preventScroll: true }); }
}

let toastT = null, toastFn = null;

}

function setActiveByScene(n) { const p = paneOfScene(n); if (p) setActivePane(p); }
function setMode(mode) {

/** 두 씬 비교를 닫고, 작업 대상이던 씬의 단일 화면으로 돌아갑니다. */
function exitCompare() { if (store.route.name === 'compare') navigate({ name: 'scene', a: activeScene() }); }

function setPaneView(scene, view) { const v = viewOf(scene); if (v.paneView === view) return; v.paneView = view; persist(); renderApp(); }

async function doSearch(q) {
  q = (q || '').trim();
  if (!q) { clearSearch(); return; }
  const id = ++store.search.reqId;
  Object.assign(store.search, { q, status: 'loading', error: null });
  store.sort = null;
  const inp = $('#q');
  if (inp && inp.value !== q) inp.value = q;
  syncClearBtn();
  renderResults();
  try {
    const res = await api.searchScenes(q, { datasetId: DATASET_ID, k: 10 });
    if (id !== store.search.reqId) return;
    store.search.result = res;
    store.search.status = 'done';
    setMsg(res.items.length ? `“${q}” 검색 결과 ${res.items.length}개` : `“${q}” 검색 결과 없음`, 'quiet');
  } catch (e) {

function clearSearch() {
