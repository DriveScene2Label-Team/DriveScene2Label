spring.application.name=DriveScene2Label
operations.token=${OPERATIONS_TOKEN:}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/drivescene}
spring.datasource.username=${DB_USERNAME:drivescene}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:5000000000B}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:5001048576B}
uploads.root=${UPLOAD_ROOT:./.local/uploads}
uploads.s3-bucket=${UPLOAD_S3_BUCKET:}
uploads.max-expanded-bytes=${UPLOAD_MAX_EXPANDED_BYTES:8589934592}
uploads.worker.enabled=${UPLOAD_WORKER_ENABLED:${auto-label.worker.enabled}}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
nuscenes.root=${NUSCENES_ROOT:/data/nuscenes}
nuscenes.version=${NUSCENES_VERSION:v1.0-mini}
nuscenes.import.enabled=${NUSCENES_IMPORT_ENABLED:false}
# Explicit data origin recorded with the import checksum: SYNTHETIC, NUSCENES or UNKNOWN (never inferred).
nuscenes.data-origin=${NUSCENES_DATA_ORIGIN:UNKNOWN}
server.error.include-message=always
# Revalidate the SPA shell after deployment so it cannot keep referencing retired chunks.
spring.web.resources.cache.cachecontrol.no-cache=true
embedding.model-name=${EMBEDDING_MODEL_NAME:ViT-L-14-quickgelu/openai}
embedding.preprocess=${EMBEDDING_PREPROCESS:lr-square-crop-mean}
embedding.index-worker.enabled=${EMBEDDING_INDEX_WORKER_ENABLED:${auto-label.worker.enabled}}
# Search matchScore (0..100, not a probability): score rescaled between calibrated anchors per aggregation.
# lower = p90 of unrelated-text scores, upper = median score short queries get on the scenes they describe
# (scripts/match_score_queries.mini.json; a long-description anchor put correct short-query hits at ~70 points).
# Measured 2026-11-05 on v1.0-mini (10 scenes) with scripts/calibrate_match_score.py; see docs/search-match-score.md.
# Only applied when the embedding model/preprocess below match; otherwise matchScore is null.
search.match-score.model-name=ViT-L-14-quickgelu/openai
search.match-score.preprocess=lr-square-crop-mean
search.match-score.top-k-average.lower=0.173
search.match-score.top-k-average.upper=0.232
search.match-score.max.lower=0.177
search.match-score.max.upper=0.236
search.match-score.average.lower=0.134
search.match-score.average.upper=0.182

# Spring -> AI server (host process defaults; Compose overrides this URL).
ai-server.base-url=${AI_SERVER_BASE_URL:http://127.0.0.1:8000}
ai-server.connect-timeout=${AI_SERVER_CONNECT_TIMEOUT:5s}
ai-server.read-timeout=${AI_SERVER_READ_TIMEOUT:30s}

auto-label.dataset-version=${VESPA_DATASET_VERSION:v1.0-trainval}
auto-label.model-version=${VESPA_MODEL_VERSION:acb2b6e8683363795528f049fe0444ef9f3efdb9+ds2l-p1-p2}
auto-label.read-timeout=${AUTO_LABEL_READ_TIMEOUT:7300s}
auto-label.worker.enabled=${AUTO_LABEL_WORKER_ENABLED:true}
auto-label.artifact-storage-key=${VESPA_ARTIFACT_STORAGE_KEY:vespa-results}

# Rerun recordings (docs/rerun-recording.md). Backend reads the shared rerun_recordings volume; ai-server writes it.
recording.root=${RECORDING_ROOT:/recordings}
recording.worker.enabled=${RECORDING_WORKER_ENABLED:true}
recording.read-timeout=${RECORDING_READ_TIMEOUT:660s}
recording.sdk-version=${RECORDING_SDK_VERSION:0.38.1}
recording.export-version=${RECORDING_EXPORT_VERSION:ds2l-rrd-v3}

# Feature readiness (GET /api/system/status). AI /capabilities is cached briefly; refresh=true re-checks (read-only).
ai-server.capabilities.connect-timeout=${AI_CAPABILITIES_CONNECT_TIMEOUT:2s}
ai-server.capabilities.read-timeout=${AI_CAPABILITIES_READ_TIMEOUT:5s}
ai-server.capabilities.refresh-timeout=${AI_CAPABILITIES_REFRESH_TIMEOUT:90s}
system-status.ai-cache=${SYSTEM_STATUS_AI_CACHE:15s}
