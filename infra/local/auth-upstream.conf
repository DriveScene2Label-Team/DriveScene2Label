# Authentication and team membership are checked by oauth2-proxy before this hop.
# Spring does not consume the OIDC session. Keep it out of Tomcat's header budget.
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 256; }

http {
    log_format timing escape=json
        '{"service":"auth-upstream","method":"$request_method","path":"$uri",'
        '"status":$status,"duration_s":$request_time,"upstream_s":"$upstream_response_time",'
        '"request_id":"$upstream_http_x_request_id"}';
    access_log /dev/stdout timing;
    # Bounded space for the authenticated incoming cookie; never log its contents.
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    client_max_body_size 5000000000;
    client_body_timeout 600s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream spring_backend {
        zone spring_backend 64k;
        server backend:8080 resolve;
    }
    server {
        listen 8081;
        server_tokens off;
        location = /_gateway_health {
            access_log off;
            return 204;
        }
        location / {
            proxy_pass http://spring_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            # Other headers (Idempotency-Key, Range, If-Range, Content-Type) pass through.
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 660s;
            proxy_next_upstream off;
        }
    }
}
