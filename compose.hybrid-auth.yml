# Public ingress terminates at this authenticated gateway. Spring and GPU stay private.
services:
  auth-upstream:
    # Only oauth2-proxy can be reached through the public tunnel. No host port here.
    image: nginx:1.30.4-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./infra/local/auth-upstream.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/_gateway_health"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  auth-gateway:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    depends_on:
      auth-upstream:
        condition: service_healthy
    env_file:
      - ${HYBRID_AUTH_ENV_PATH:?Set the protected local auth environment file}
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_UPSTREAMS: http://auth-upstream:8081/
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: cognito:username
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: cognito:groups
      OAUTH2_PROXY_ALLOWED_GROUPS: team
      OAUTH2_PROXY_SCOPE: openid
      OAUTH2_PROXY_SKIP_CLAIMS_FROM_PROFILE_URL: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_INSECURE_OIDC_SKIP_NONCE: "false"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_COOKIE_NAME: __Host-ds2l
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 8h
      OAUTH2_PROXY_COOKIE_REFRESH: 30m
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
      OAUTH2_PROXY_PASS_BASIC_AUTH: "false"
      OAUTH2_PROXY_UPSTREAM_TIMEOUT: 600s
      OAUTH2_PROXY_REQUEST_LOGGING: "false"
      OAUTH2_PROXY_API_ROUTES: ^/api/
    ports:
      - "127.0.0.1:4180:4180"
    restart: unless-stopped
