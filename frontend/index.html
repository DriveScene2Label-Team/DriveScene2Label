<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>DriveScene2Label</title>
    <!-- System fonts only (design). Apply the saved theme before first paint to avoid a light/dark flash. -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('ds2l.layout') || 'null');
        var t = p && p.v === 2 && p.data ? p.data.theme : 'light';
        document.documentElement.dataset.theme = t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : (t === 'dark' ? 'dark' : 'light');
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>이 앱은 JavaScript가 필요해요.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
